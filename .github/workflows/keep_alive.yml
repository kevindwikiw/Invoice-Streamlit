name: Ping Supabase to Prevent Pausing
on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via REST API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/app_config?select=key&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
